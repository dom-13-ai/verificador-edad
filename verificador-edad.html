<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de edad</title>
</head>
<body>

    <h1>Verificador de edad</h1>

    <label for="edadInput">Ingresa tu edad:</label>
    <input type="number" id="edadInput" placeholder="Ej. 20">
    <button id="btnVerificar" onclick="verificarEdad()">Verificar</button>

    <script>
        function verificarEdad() {
            // Declaración de variable y obtención del valor desde HTML
            let entrada = document.getElementById("edadInput").value;

            // Validación de campo vacío
            if (entrada.trim() === "") {
                alert("Por favor, ingresa una edad. El campo no puede estar vacío.");
            } 
            // Validación de número válido y mayor o igual a cero
            else if (isNaN(entrada) || Number(entrada) < 0) {
                alert("Por favor, ingresa un número válido mayor o igual a 0.");
            } 
            // Evaluación de mayoría de edad
            else if (Number(entrada) >= 18) {
                alert("Eres mayor de edad");
            } 
            // Evaluación de minoría de edad
            else {
                alert("Eres menor de edad");
            }
        }
    </script>

</body>
</html>
